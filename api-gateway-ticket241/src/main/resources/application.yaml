spring:
  application:
    name: api-gateway-ticket241

  cloud:
    gateway:
      routes:

        # Route pour Auth Service (sansle  filtre JWT)
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback
        # Route pour Event Service (avec le filtre JWT)
        - id: event-service-route
          uri: lb://EVENT-SERVICE-TICKET241
          predicates:
            - Path=/api/events/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback
        # Route pour Ticket Service ( avec le filtre JWT)
        - id: ticket-service-route
          uri: lb://TICKET-SERVICE-TICKET241
          predicates:
            - Path=/api/tickets/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: ticketServiceCircuitBreaker
                fallbackUri: forward:/fallback
      default-filters:
        - name: GlobalLoggingFilter

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true


