spring:
  application:
    name: api-gateway-ticket241

  cloud:
    gateway:
      routes:

        # Route pour Auth Service (sans le filtre JWT)
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Route pour Event Service (avec le filtre JWT)
        - id: event-service-route
          uri: lb://EVENT-SERVICE-TICKET241
          predicates:
            - Path=/api/events/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Route pour Ticket Service (avec le filtre JWT)
        - id: ticket-service-route
          uri: lb://TICKET-SERVICE-TICKET241
          predicates:
            - Path=/api/tickets/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: ticketServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Route pour Notification Service (SANS le filtre JWT)
        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE-TICKET241
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Logging pour debugging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.tchelo: DEBUG
    io.github.resilience4j: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3s

    instances:
      authServiceCircuitBreaker:
        base-config: default

      eventServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 60

      ticketServiceCircuitBreaker:
        base-config: default

      # Configuration pour Notification Service
      notificationServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 60

  timelimiter:
    configs:
      default:
        timeout-duration: 3s

    instances:
      authServiceCircuitBreaker:
        timeout-duration: 8s
      eventServiceCircuitBreaker:
        timeout-duration: 3s
      ticketServiceCircuitBreaker:
        timeout-duration: 3s
      # Timeout pour Notification Service (plus long pour emails)
      notificationServiceCircuitBreaker:
        timeout-duration: 5s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true