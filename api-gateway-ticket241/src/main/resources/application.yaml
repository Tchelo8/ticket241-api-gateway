spring:
  application:
    name: api-gateway-ticket241

  cloud:
    gateway:
      routes:

        # Route pour Auth Service (sans le filtre JWT)
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Routes PUBLIQUES d'Event Service (sans JWT) : un visiteur peut parcourir les événements avant
        # de créer un compte. Uniquement des lectures (GET) listées une à une, plus le compteur de vues.
        # Les headers d'identité sont SUPPRIMÉS : un client ne peut pas se faire passer pour un admin
        # en les envoyant lui-même. order: -1 → évaluées avant la route protégée ci-dessous.
        - id: event-service-public-read-route
          uri: lb://EVENT-SERVICE-TICKET241
          order: -1
          predicates:
            - Method=GET
            - Path=/api/events/all,/api/events/search,/api/events/upcoming,/api/events/featured,/api/events/slug/*,/api/events/category/*,/api/events/city/*,/api/events/{uuid:[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+},/api/events/{eventId:[0-9]+}/categories/{categoryId:[0-9]+},/api/events/{eventId:[0-9]+}/categories/{categoryId:[0-9]+}/availability,/api/events/categories/get/all,/api/events/categories/{uuid:[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+},/api/events/cities/**
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-User-Structure-Id
            - RemoveRequestHeader=X-User-Account-Id
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback

        - id: event-service-public-view-route
          uri: lb://EVENT-SERVICE-TICKET241
          order: -1
          predicates:
            - Method=POST
            - Path=/api/events/{uuid:[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+}/view
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-User-Structure-Id
            - RemoveRequestHeader=X-User-Account-Id
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Route pour Event Service (avec le filtre JWT) : tout le reste (création, gestion, back-office…)
        - id: event-service-route
          uri: lb://EVENT-SERVICE-TICKET241
          predicates:
            - Path=/api/events/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: eventServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Achat SANS compte (route PUBLIQUE) : réservation, paiement et billets d'une commande invité,
        # protégés par le jeton de la commande ou une session ouverte par code (headers X-Guest-*).
        # Headers d'identité SUPPRIMÉS comme pour les routes publiques d'événements ; order: -1 → avant
        # la route protégée. Le rattachement à un compte (/api/tickets/order/*/claim-guest) reste derrière le JWT.
        - id: ticket-service-guest-route
          uri: lb://TICKET-SERVICE-TICKET241
          order: -1
          predicates:
            - Path=/api/tickets/guest/**
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-User-Structure-Id
            - RemoveRequestHeader=X-User-Account-Id
            - name: CircuitBreaker
              args:
                name: ticketServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Route pour Ticket Service (avec le filtre JWT)
        - id: ticket-service-route
          uri: lb://TICKET-SERVICE-TICKET241
          predicates:
            - Path=/api/tickets/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: ticketServiceCircuitBreaker
                fallbackUri: forward:/fallback

        # Route pour Notification Service (avec le filtre JWT) : sans lui, n'importe qui pouvait envoyer
        # des emails depuis l'adresse Ticket241 ou lire les préférences et l'historique des utilisateurs
        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE-TICKET241
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration
# Secret obligatoire, jamais écrit ici (dépôt public) : variable d'environnement JWT_SECRET ou, en local,
# fichier non versionné config/application.yaml (voir config/secrets.example.yaml).
# Doit être IDENTIQUE à celui d'auth-service. Pas de valeur par défaut : sans secret, le service refuse de démarrer.
jwt:
  secret: ${JWT_SECRET}

# Logging pour debugging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.tchelo: DEBUG
    io.github.resilience4j: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3s

    instances:
      authServiceCircuitBreaker:
        base-config: default

      eventServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 60

      ticketServiceCircuitBreaker:
        base-config: default

      # Configuration pour Notification Service
      notificationServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 60

  timelimiter:
    configs:
      default:
        timeout-duration: 3s

    instances:
      authServiceCircuitBreaker:
        timeout-duration: 8s
      eventServiceCircuitBreaker:
        timeout-duration: 3s
      ticketServiceCircuitBreaker:
        timeout-duration: 3s
      # Timeout pour Notification Service (plus long pour emails)
      notificationServiceCircuitBreaker:
        timeout-duration: 5s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true